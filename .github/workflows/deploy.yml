name: Deploy Portfolio Engine to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers code build on every push to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Core Code Base
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Web Deployment Environment
        uses: actions/configure-pages@v4

      - name: Package Workspace Production Static Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads everything from root folder

      - name: Deliver Artifact Targets Live to Web Engine
        id: deployment
        uses: actions/deploy-pages@v4
